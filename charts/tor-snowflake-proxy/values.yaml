# Default values for tor-snowflake-proxy
# This is a YAML-formatted file.

# Number of proxy replicas to run
replicaCount: 1

image:
  repository: thetorproject/snowflake-proxy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Snowflake proxy configuration
snowflake:
  # Broker URL (default is the official Tor broker)
  brokerURL: "https://snowflake-broker.torproject.net/"
  # Default STUN servers for WebRTC NAT traversal
  stunServers:
    - "stun:stun.l.google.com:19302"
    - "stun:stun.voip.blackberry.com:3478"
  # Relay URL (default is the official Tor relay)
  relayURL: "wss://snowflake.torproject.net/"
  # Verbose logging
  verbose: false
  # Keep local addresses (useful for debugging)
  keepLocalAddresses: false
  # Unsafe logging (logs client IPs - only for debugging)
  unsafeLogging: false
  # Capacity for concurrent clients (0 = unlimited)
  capacity: 0
  # Summary interval in seconds (0 = disabled)
  summaryInterval: 3600

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000

securityContext: {}
  # allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #     - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 64Mi

# Node selector for pod scheduling
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity rules for pod scheduling
affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  # minReplicas: 2
  # maxReplicas: 10
  # targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Network policy
networkPolicy:
  enabled: false
  # Additional egress rules
  additionalEgressRules: []

# Metrics/monitoring (Snowflake doesn't expose Prometheus metrics natively)
metrics:
  enabled: false

# Extra environment variables
extraEnvVars: []

# Extra arguments to pass to the tor-snowflake-proxy binary
extraArgs: []
